<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naija Traffic Dash: Danfo Run</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        h1 { color: #ffcc00; margin-bottom: 10px; font-size: 1.5rem; text-align: center; text-shadow: 2px 2px #ff0000; }
        #game-container { position: relative; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5); border: 4px solid #ffcc00; border-radius: 8px; overflow: hidden; background: #222; }
        canvas { display: block; background: #333; width: 100%; max-width: 380px; height: auto; }
        .controls-hint { margin-top: 15px; text-align: center; font-size: 0.85rem; color: #aaa; max-width: 380px; line-height: 1.4; }
        .btn-row { display: flex; gap: 20px; margin-top: 15px; }
        .control-btn { background: #ffcc00; color: #111; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>DANFO RUN</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <div class="controls-hint">
        Tap <span>LEFT</span> or <span>RIGHT</span> buttons below to steer your Danfo bus. Press Restart on screen if you crash!
    </div>

    <div class="btn-row">
        <button class="control-btn" id="leftBtn">◀</button>
        <button class="control-btn" id="rightBtn">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let gameOver = false;
        let gameSpeed = 4;

        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 100,
            width: 50,
            height: 90,
            speed: 8
        };

        let obstacles = [];
        let spawnTimer = 0;

        document.getElementById("leftBtn").addEventListener("touchstart", () => {
            if (player.x > 40) player.x -= player.speed * 3;
        });
        document.getElementById("rightBtn").addEventListener("touchstart", () => {
            if (player.x < canvas.width - 90) player.x += player.speed * 3;
        });
        document.getElementById("leftBtn").addEventListener("click", () => {
            if (player.x > 40) player.x -= player.speed * 3;
        });
        document.getElementById("rightBtn").addEventListener("click", () => {
            if (player.x < canvas.width - 90) player.x += player.speed * 3;
        });

        function resetGame() {
            score = 0;
            gameSpeed = 4;
            obstacles = [];
            gameOver = false;
            player.x = canvas.width / 2 - 25;
            loop();
        }

        function spawnObstacle() {
            const lanes = [65, 175, 285];
            const laneX = lanes[Math.floor(Math.random() * lanes.length)];
            const types = ['car', 'pothole', 'hawker'];
            const type = types[Math.floor(Math.random() * types.length)];

            obstacles.push({
                x: laneX,
                y: -100,
                width: 50,
                height: type === 'pothole' ? 40 : 80,
                type: type,
                speed: gameSpeed * 0.8
            });
        }

        canvas.addEventListener("click", () => {
            if (gameOver) resetGame();
        });

        function update() {
            if (gameOver) return;

            spawnTimer++;
            if (spawnTimer > 70) {
                spawnObstacle();
                spawnTimer = 0;
                gameSpeed += 0.05;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed;

                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    gameOver = true;
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function drawRoad() {
            ctx.fillStyle = "#444";
            ctx.fillRect(30, 0, canvas.width - 60, canvas.height);
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(0, 0, 30, canvas.height);
            ctx.fillRect(canvas.width - 30, 0, 30, canvas.height);

            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -Date.now() * gameSpeed * 0.1 % 40;

            ctx.beginPath();
            ctx.moveTo(133, 0); ctx.lineTo(133, canvas.height); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(266, 0); ctx.lineTo(266, canvas.height); ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawPlayer() {
            ctx.fillStyle = "#ffcc00";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "#111";
            ctx.fillRect(player.x + 5, player.y + 10, player.width - 10, 20);
            ctx.fillRect(player.x + 5, player.y + 40, player.width - 10, 15);
            ctx.fillRect(player.x + 5, player.y + 65, player.width - 10, 15);
            ctx.fillStyle = "#fff";
            ctx.fillRect(player.x + 2, player.y, 8, 4);
            ctx.fillRect(player.x + player.width - 10, player.y, 8, 4);
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                if (obs.type === 'pothole') {
                    ctx.fillStyle = "#111";
                    ctx.beginPath();
                    ctx.ellipse(obs.x + 25, obs.y + 20, 25, 15, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obs.type === 'hawker') {
                    ctx.fillStyle = "#d32f2f";
                    ctx.fillRect(obs.x + 10, obs.y + 20, 30, 40);
                    ctx.fillStyle = "#ffcc00";
                    ctx.fillRect(obs.x + 15, obs.y + 10, 20, 15);
                } else {
                    ctx.fillStyle = "#e91e63";
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.fillStyle = "#111";
                    ctx.fillRect(obs.x + 5, obs.y + 15, obs.width - 10, 25);
                }
            });
        }

        function drawUI() {
            ctx.fillStyle = "#fff";
            ctx.font = "bold 18px 'Courier New'";
            ctx.fillText(`SCORE: ${score}`, 40, 30);

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 30px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("CRASH!", canvas.width / 2, canvas.height / 2 - 30);
                ctx.fillStyle = "#fff";
                ctx.font = "16px 'Courier New'";
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText("Tap screen to Restart", canvas.width / 2, canvas.height / 2 + 50);
                ctx.textAlign = "left";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRoad();
            drawObstacles();
            drawPlayer();
            drawUI();
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>
</body>
</html>
